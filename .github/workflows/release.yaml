name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Toolchain version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: "pack ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - windows-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update -q && sudo apt-get install -y -q yq zstd unzip xz-utils

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build toolchain tarball
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: |
          chmod +x scripts/fetch-and-pack.sh
          scripts/fetch-and-pack.sh "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.platform }}
          path: dist/toolchain-*.tar.zst
          retention-days: 1

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate manifest.json and release notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          entries=()
          for f in dist/toolchain-*.tar.zst; do
            sha=$(sha256sum "$f" | awk '{print $1}')
            plat=$(basename "$f" | sed "s/toolchain-${VERSION}-//;s/\.tar\.zst//")
            entries+=("{\"platform\":\"$plat\",\"file\":\"$(basename "$f")\",\"sha256\":\"$sha\"}")
          done
          IFS=,
          printf '{"toolchain_version":"%s","artifacts":[%s]}' "$VERSION" "${entries[*]}" | jq . > dist/manifest.json
          cat dist/manifest.json
          UV_VER=$(yq -r '.tools.uv.version' "manifests/$VERSION/manifest.yaml")
          NODE_VER=$(yq -r '.tools.node.version' "manifests/$VERSION/manifest.yaml")
          RG_VER=$(yq -r '.tools.ripgrep.version' "manifests/$VERSION/manifest.yaml")
          JQ_VER=$(yq -r '.tools.jq.version' "manifests/$VERSION/manifest.yaml")
          printf '## Bundled Toolchain %s\n\nPlatforms: linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64\n\nTools bundled:\n- uv %s\n- node %s LTS + npm + npx\n- ripgrep %s\n- jq %s\n' \
            "$VERSION" "$UV_VER" "$NODE_VER" "$RG_VER" "$JQ_VER" > /tmp/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "Bundled toolchain $VERSION" \
            --notes-file /tmp/notes.md \
            dist/toolchain-*.tar.zst \
            dist/manifest.json \
            "manifests/$VERSION/manifest.yaml"
