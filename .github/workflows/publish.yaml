# Workflow: build and publish toolchain release artifacts.
#
# Trigger manually via `gh workflow run publish.yaml -f version=v1.0.0`,
# or automatically on tag push matching v*.
name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Toolchain version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: "build ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - windows-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q yq zstd unzip xz-utils

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build toolchain tarball
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: |
          chmod +x scripts/fetch-and-pack.sh
          scripts/fetch-and-pack.sh "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.platform }}
          path: |
            dist/toolchain-*.tar.zst
          retention-days: 1

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate manifest.json
        run: |
          jq -n --arg v "${{ steps.ver.outputs.version }}" \
            '[inputs] | {toolchain_version: $v, artifacts: .}' \
            <(for f in dist/toolchain-*.tar.zst; do
                sha=$(sha256sum "$f" | awk '{print $1}')
                plat=$(basename "$f" | sed "s/toolchain-${{ steps.ver.outputs.version }}-//;s/\.tar\.zst//")
                echo "{\"platform\":\"$plat\",\"file\":\"$(basename $f)\",\"sha256\":\"$sha\"}"
              done) > dist/manifest.json
          cat dist/manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release create "$VERSION" \
            --title "Bundled toolchain $VERSION" \
            --notes "## Bundled Toolchain $VERSION

Platforms: linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64

Tools bundled:
- uv 0.5.10
- node 22.11.0 (LTS) + npm + npx
- ripgrep 14.1.1
- jq 1.7.1

See \`manifests/$VERSION/manifest.yaml\` for upstream SHA256 verification checksums.
See \`dist/manifest.json\` in this release for tarball SHA256s." \
            dist/toolchain-*.tar.zst \
            dist/manifest.json \
            "manifests/$VERSION/manifest.yaml"
