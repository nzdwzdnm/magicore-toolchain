# manifest.yaml for toolchain v1.0.0
#
# This file is the upstream-source pin: scripts/fetch-and-pack.sh reads
# it, downloads each URL, verifies sha256, and emits the per-platform
# tar.zst tarballs that ship as Release assets.
#
# SHA256 values: pulled from upstream-published SHASUMS or release sidecar.
# Update procedure: bump the version, run `make refresh-shas` to recompute,
# commit the diff. NEVER edit a sha by hand.

manifest_version: "1.0.0"

tools:
  uv:
    version: "0.5.10"
    binaries: [uv, uvx]
    platforms:
      linux-amd64:
        url: "https://github.com/astral-sh/uv/releases/download/0.5.10/uv-x86_64-unknown-linux-gnu.tar.gz"
        sha256: "TODO-fill-from-upstream-SHASUMS"
      linux-arm64:
        url: "https://github.com/astral-sh/uv/releases/download/0.5.10/uv-aarch64-unknown-linux-gnu.tar.gz"
        sha256: "TODO"
